<!DOCTYPE html>
<html lang="en">
<head>
<style>
  .pyramid-container {
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    background: #ffffff;
    min-height: 700px;
  }

  h2 {
    color: #1a1a2e;
    margin-bottom: 4px;
    font-size: 1.5rem;
    text-align: center;
  }

  .pyramid-subtitle {
    text-align: center;
    font-size: 0.9rem;
    color: #1a1a2e;
    margin-bottom: 30px;
  }

  .pyramid-subtitle u {
    text-decoration: underline;
  }

  .pyramid-wrapper {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .pyramid {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .pyramid {
    gap: 0 !important;
  }

  .tier {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: filter 0.2s ease, transform 0.2s ease;
    background: #ffe066;
    border: 2px solid #ffffff;
    box-sizing: border-box;
  }

  .tier:hover {
    filter: brightness(0.96);
    transform: scaleX(1.02);
  }

  .tier-inner {
    color: #1a1a2e;
    font-weight: 700;
    font-size: 1.05rem;
    text-align: center;
    padding: 6px 14px;
    width: 100%;
  }

  .tier-1 {
    width: 186px;
    height: 125px;
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    background: #ffe066;
  }

  .tier-1 .tier-inner {
    padding: 70px 4px 0 4px;
    font-size: 0.68rem;
    line-height: 1.2;
  }

  .tier-1 .tier-percent {
    font-size: 0.8rem;
    margin-top: 1px;
  }

  .tier-1 .tier-label {
    font-size: 0.55rem;
    margin-top: 2px;
  }

  .tier-2 {
    width: 371px;
    height: 125px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
    background: #fbd046;
  }

  .tier-3 {
    width: 640px;
    height: 181px;
    clip-path: polygon(20.97% 0%, 79.03% 0%, 100% 100%, 0% 100%);
    background: #f4c02e;
  }

  .tier-percent {
    display: block;
    font-size: 1.15rem;
    margin-top: 2px;
  }

  .tier-3 .tier-percent {
    font-size: 2.4rem;
    color: #1a1a2e;
  }

  .tier-label {
    font-size: 0.8rem;
    font-weight: 400;
    font-style: italic;
    color: #333;
    display: block;
    margin-top: 4px;
  }

  .info-panel {
    width: 340px;
    min-height: 260px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    padding: 24px;
    transition: opacity 0.3s ease;
    border-top: 5px solid #ccc;
  }

  .info-panel.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .info-panel h3 {
    margin: 0 0 6px 0;
    font-size: 1rem;
    color: #1a1a2e;
  }

  .info-panel .badge {
    display: inline-block;
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 20px;
    color: white;
    margin-bottom: 14px;
  }

  .info-panel .section-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    color: #888;
    margin-top: 12px;
    margin-bottom: 4px;
  }

  .info-panel p {
    font-size: 0.82rem;
    color: #444;
    margin: 0;
    line-height: 1.5;
  }

  .default-msg {
    color: #aaa;
    font-size: 0.85rem;
    text-align: center;
    margin-top: 60px;
  }
</style>
</head>
<body>

<div class="pyramid-container">
  <h2>URA's AI Competency Pyramid</h2>
  <div class="pyramid-subtitle"><u>Possible</u> Tiering for URA by 2030</div>
  <div class="pyramid-wrapper">

    <div class="pyramid">

      <div class="tier tier-1"
           onmouseenter="showInfo('specialists')"
           onmouseleave="hideInfo()">
        <div class="tier-inner">
          AI Specialists
          <span class="tier-percent">~3%</span>
          <span class="tier-label">(i.e. around 30 pax)</span>
        </div>
      </div>

      <div class="tier tier-2"
           onmouseenter="showInfo('practitioners')"
           onmouseleave="hideInfo()">
        <div class="tier-inner">
          AI Practitioners
          <span class="tier-percent">~25%</span>
          <span class="tier-label">(i.e. around 250 pax)</span>
        </div>
      </div>

      <div class="tier tier-3"
           onmouseenter="showInfo('everyone')"
           onmouseleave="hideInfo()">
        <div class="tier-inner">
          AI for Everyone
          <span class="tier-percent">100%</span>
        </div>
      </div>

    </div>

    <div class="info-panel hidden" id="infoPanel">
      <div id="panelContent">
        <p class="default-msg">Hover over a tier to see details.</p>
      </div>
    </div>

  </div>
</div>

<script>
  const tierData = {
    specialists: {
      title: "AI Specialists",
      subtitle: "Technical Experts",
      color: "#c0392b",
      capabilities: "Production-grade AI engineering — deep technical experts who design, build, and govern AI systems (e.g. URA AI team, technical leads, IT integration and security teams).",
      courses: "Specialised courses on advanced and emerging AI/ML techniques; AI conferences and engagements with researchers and tech providers; regular literature and horizon scans."
    },
    practitioners: {
      title: "AI Practitioners",
      subtitle: "Applied Users",
      color: "#e67e22",
      capabilities: "Business-led AI product capabilities — product owners, business analysts, data-savvy officers, Change Managers. Equip staff to scope, evaluate and manage use cases, and ability to prototype with COTS/Central tools.",
      courses: "AI Product / Governance / Risk Management Courses (by CSC, GovTech Digital Academy, IHLs); GovTech AI Champion Bootcamp; Applied AI clinics and hands-on workshops e.g. AIBots / Pair Assistant build-and-share trainings."
    },
    everyone: {
      title: "AI for Everyone",
      subtitle: "Basic Literacy",
      color: "#2980b9",
      capabilities: "Responsible AI literacy — understanding what AI is, how it works, its benefits, limitations, and ethical considerations. Ability to use AI for general tasks such as writing, summarising, and information retrieval.",
      courses: "Compulsory LEARN courses and AI modules; hands-on clinics for AI tool launches; mass sharings by URA AI team and invited speakers/tech providers; URA AI Central Portal (self-help resources)."
    }
  };

  let hideTimeout;

  function showInfo(tier) {
    clearTimeout(hideTimeout);
    const data = tierData[tier];
    const panel = document.getElementById('infoPanel');
    const content = document.getElementById('panelContent');

    panel.style.borderTopColor = data.color;

    content.innerHTML = `
      <h3>${data.title}</h3>
      <span class="badge" style="background:${data.color}">${data.subtitle}</span>

      <div class="section-label">Capabilities</div>
      <p>${data.capabilities}</p>

      <div class="section-label">Courses &amp; Training</div>
      <p>${data.courses}</p>
    `;

    panel.classList.remove('hidden');
  }

  function hideInfo() {
    hideTimeout = setTimeout(() => {
      document.getElementById('infoPanel').classList.add('hidden');
    }, 200);
  }

  document.getElementById('infoPanel').addEventListener('mouseenter', () => {
    clearTimeout(hideTimeout);
  });
  document.getElementById('infoPanel').addEventListener('mouseleave', () => {
    hideInfo();
  });
</script>

</body>
</html>
